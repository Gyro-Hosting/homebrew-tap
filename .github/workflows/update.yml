name: update-formula
# Keeps Formula/gyro.rb at the latest signed gyro-cli release.
# Runs hourly, on demand, and when gyro-cli sends a repository_dispatch (type: gyro-release).
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest)"
        required: false
  repository_dispatch:
    types: [gyro-release]

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
        run: python3 scripts/update_formula.py $TAG
      - name: Commit
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          v=$(grep -m1 -o 'gyro_[0-9.]*_darwin' Formula/gyro.rb | sed 's/gyro_\(.*\)_darwin/\1/')
          git config user.name "gyro-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gyro ${v}"
          git push
